name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --bundles app
            cmake_osx_deployment_target: '10.15'
            cflags: -mmacosx-version-min=10.15
            cxxflags: -mmacosx-version-min=10.15
          - platform: windows-latest
            args: --bundles msi,nsis
            cmake_osx_deployment_target: ''
            cflags: ''
            cxxflags: ''
          - platform: ubuntu-latest
            args: --bundles appimage,deb
            cmake_osx_deployment_target: ''
            cflags: ''
            cxxflags: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build llama-cli sidecar (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/llama.cpp/build --target llama-cli --config Release -j 4
          mkdir -p src-tauri/binaries
          cp /tmp/llama.cpp/build/bin/llama-cli src-tauri/binaries/llama-cli
          chmod +x src-tauri/binaries/llama-cli

      - name: Build llama-cli sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git $env:TEMP/llama.cpp
          cmake -S $env:TEMP/llama.cpp -B $env:TEMP/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build $env:TEMP/llama.cpp/build --target llama-cli --config Release
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          if (Test-Path "$env:TEMP/llama.cpp/build/bin/Release/llama-cli.exe") {
            Copy-Item "$env:TEMP/llama.cpp/build/bin/Release/llama-cli.exe" "src-tauri/binaries/llama-cli.exe" -Force
          } elseif (Test-Path "$env:TEMP/llama.cpp/build/bin/llama-cli.exe") {
            Copy-Item "$env:TEMP/llama.cpp/build/bin/llama-cli.exe" "src-tauri/binaries/llama-cli.exe" -Force
          } else {
            throw "llama-cli.exe not found in expected build output paths"
          }

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.cmake_osx_deployment_target }}
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MedScribeAI ${{ github.ref_name }}
          releaseBody: Automated multi-platform release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
